<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        neu: {
          bg: 'var(--neu-bg)',
          box: 'var(--neu-box)',
          track: 'var(--neu-track)',
          text: 'var(--neu-text)',
          accent: 'var(--neu-accent)',
          highlight: 'var(--neu-highlight)'
        }
      },
      fontFamily: {
        sans: ['Open Sans', 'sans-serif'],
        mono: ['JetBrains Mono', 'monospace']
      }
    }
  }
}
</script>
<style>
  :root {
    --neu-bg: #fbfaf6;
    --neu-box: #f2f0e6;
    --neu-track: #e8e5d8;
    --neu-text: #000000;
    --neu-accent: #666666;
    --neu-highlight: #000000;
  }
  .dark-mode {
    --neu-bg: #000432;
    --neu-box: #080c4a;
    --neu-track: #15195c;
    --neu-text: #e2e8f0;
    --neu-accent: #818cf8;
    --neu-highlight: #c7d2fe;
  }
  body {
    background-color: var(--neu-bg);
    color: var(--neu-text);
    font-weight: 400;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--neu-bg);
    border-radius: 4px;
    margin-block: 10px;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--neu-track);
    border-radius: 4px;
  }
  .panel-hidden {
    display: none !important;
  }
  
  /* Toasts */
    #toasts { position: fixed; bottom: 90px; right: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 9999; }
    .toast { padding: 12px 16px; background: var(--neu-text); color: var(--neu-bg); border: none; font-size: 13px; font-weight: 500; border-radius: 16px; animation: slideUp 150ms ease-out forwards; max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Tab / Cat Buttons */
  .tab-btn { padding: 8px 20px; font-weight: 600; font-size: 11px; border: 1px solid var(--neu-track); border-radius: 16px; transition: all 150ms; background: var(--neu-bg); color: var(--neu-text); cursor: pointer; }
  .tab-btn.active { background: var(--neu-box); color: var(--neu-highlight); border-color: var(--neu-highlight); }
  .cat-btn { font-size: 10px; font-weight: 500; padding: 6px 14px; color: var(--neu-accent); background: var(--neu-bg); border: 1px solid var(--neu-track); border-radius: 9999px; transition: all 120ms; cursor: pointer; }
  .cat-btn:hover, .cat-btn.active { color: var(--neu-highlight); background: var(--neu-box); border-color: var(--neu-highlight); }
</style>
<script>
  function initTheme() {
    if (localStorage.getItem('budget-theme') === 'dark') {
      document.documentElement.classList.add('dark-mode');
    }
  }
  initTheme();
  function toggleTheme() {
    const root = document.documentElement;
    root.classList.toggle('dark-mode');
    const isDark = root.classList.contains('dark-mode');
    localStorage.setItem('budget-theme', isDark ? 'dark' : 'light');
    const icon = document.querySelector('#theme-toggle i');
    if (icon) {
      icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }
  }
  window.addEventListener('DOMContentLoaded', () => {
    const isDark = document.documentElement.classList.contains('dark-mode');
    const icon = document.querySelector('#theme-toggle i');
    if (icon) icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  });
</script>
</head>
<body class="font-sans antialiased min-h-screen pb-12 transition-colors duration-300">

<!-- TOP RIGHT CONTROLS -->
<div class="fixed top-6 right-6 z-50 flex items-center gap-3">
  <div id="sync-dot" class="w-2 h-2 rounded-full bg-neu-accent shrink-0 transition-colors duration-300 shadow-sm" title="Sync status"></div>
  <button id="btn-undo" class="w-10 h-10 flex items-center justify-center rounded-xl bg-neu-box text-neu-text hover:text-neu-highlight shadow-sm transition-all" title="Undo Last Action">
    <i class="fa-solid fa-arrow-rotate-left"></i>
  </button>
  <button id="theme-toggle" onclick="toggleTheme()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-neu-box text-neu-text hover:text-neu-highlight shadow-sm transition-all" title="Toggle Theme">
    <i class="fa-solid fa-moon"></i>
  </button>
</div>

<div id="toasts"></div>

<!-- MAIN -->
<main class="max-w-4xl mx-auto px-4 py-8 pt-12 flex flex-col gap-8">
  
  <!-- HEADER -->
  <div class="mb-2">
    <span class="font-mono font-bold text-neu-highlight text-xl tracking-wide">
      <i class="fa-solid fa-indian-rupee-sign text-lg"></i> BUDGET
    </span>
  </div>

  <!-- ADD ENTRY BAR -->
    <div class="bg-neu-box p-4 rounded-[20px] flex flex-col gap-3 border border-neu-track shadow-sm">
      <div class="flex items-center gap-2">
        <span class="font-mono text-neu-highlight text-2xl leading-none font-light pl-2">›</span>
        <input id="budget-item" type="text" class="flex-1 !bg-transparent !border-none !outline-none !shadow-none focus:!ring-0 px-2 py-2 font-mono text-lg text-neu-text placeholder:text-neu-accent/50" placeholder="Amount + item..." autocomplete="off"
          onkeydown="if(event.key==='Enter')addBudgetEntry()"
          oninput="checkBudgetPerson()">
        <button class="w-12 h-12 flex items-center justify-center rounded-xl bg-neu-highlight text-neu-bg hover:opacity-90 transition-opacity shrink-0 shadow-sm" onclick="addBudgetEntry()">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
      <!-- PERSON INPUT (Hidden by default) -->
      <div id="budget-person-container" style="display:none;" class="items-center gap-2 pl-4 pr-14">
        <span class="font-mono text-neu-accent text-sm">@</span>
        <input id="budget-person" type="text" class="flex-1 !bg-transparent !border-none !outline-none !shadow-none px-2 py-1 font-mono text-sm text-neu-text placeholder:text-neu-accent/50" placeholder="Person name...">
      </div>
    </div>

  <!-- SUMMARY -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-neu-box p-5 rounded-[20px] flex flex-col justify-center relative">
        <div class="text-[10px] font-semibold text-neu-accent uppercase tracking-widest mb-1 flex justify-between items-center">
          <span>TOTAL BALANCE</span>
          <button onclick="clearBalance()" class="text-neu-accent hover:text-red-500 transition-colors p-1 -mt-1 -mr-1" title="Clear Balance to Zero">
            <i class="fa-solid fa-eraser text-[12px]"></i>
          </button>
        </div>
        <div class="font-mono text-2xl font-bold text-neu-text"><span id="budget-total">₹0</span></div>
      </div>
    <div class="bg-neu-box p-5 rounded-[20px] flex flex-col justify-center">
      <div class="text-[10px] font-semibold text-neu-accent uppercase tracking-widest mb-1">ONLINE</div>
      <div class="font-mono text-xl font-bold text-neu-text"><span id="budget-online">₹0</span></div>
    </div>
    <div class="bg-neu-box p-5 rounded-[20px] flex flex-col justify-center">
      <div class="text-[10px] font-semibold text-neu-accent uppercase tracking-widest mb-1">CASH</div>
      <div class="font-mono text-xl font-bold text-neu-text"><span id="budget-cash">₹0</span></div>
    </div>
    <div class="bg-neu-box p-5 rounded-[20px] flex flex-col justify-center">
      <div class="text-[10px] font-semibold text-neu-accent uppercase tracking-widest mb-1 text-red-500">THIS MONTH</div>
      <div class="font-mono text-xl font-bold text-red-500"><span id="budget-month">₹0</span></div>
    </div>
  </div>

  <!-- CATEGORY QUICK BUTTONS -->
    <div class="flex flex-wrap gap-2" id="cat-bar">
      <button class="cat-btn" data-cat="v">v · VEG</button>
      <button class="cat-btn" data-cat="f">f · FRUIT</button>
      <button class="cat-btn" data-cat="m">m · MILK</button>
      <button class="cat-btn" data-cat="g">g · GAS</button>
      <button class="cat-btn" data-cat="p">p · PETROL</button>
      <button class="cat-btn" data-cat="ff">ff · FAST FOOD</button>
      <button class="cat-btn" data-cat="r">r · RATION</button>
      <button class="cat-btn" data-cat="gt">gt · GIVEN TO</button>
      <button class="cat-btn" data-cat="tf">tf · TAKEN FROM</button>
    </div>

  <!-- TABS -->
  <div class="flex gap-3">
    <button class="tab-btn active" id="tab-ledger" onclick="switchTab('ledger')">LEDGER</button>
    <button class="tab-btn" id="tab-stats" onclick="switchTab('stats')">ANALYTICS</button>
  </div>

  <!-- LEDGER PANEL -->
  <div id="panel-ledger" class="flex flex-col gap-4">
    <div class="flex justify-between items-end px-2">
      <div class="font-mono text-[11px] text-neu-text tracking-widest uppercase font-medium">
        TRANSACTION LEDGER <span id="ledger-month-label" class="text-neu-accent ml-2"></span>
      </div>
    </div>
    <div id="budget-list" class="flex flex-col gap-6"></div>
  </div>

  <!-- STATS PANEL -->
  <div id="panel-stats" class="panel-hidden flex flex-col gap-4">
    <div class="flex items-center justify-between px-2">
      <div class="font-mono text-[11px] text-neu-text tracking-widest uppercase font-medium">ANALYTICS</div>
      <div class="flex gap-2">
        <button class="tab-btn active !py-1.5 !px-3 !text-[10px]" id="bstat-monthly" onclick="switchStatMode('monthly')">MONTHLY</button>
        <button class="tab-btn !py-1.5 !px-3 !text-[10px]" id="bstat-daily" onclick="switchStatMode('daily')">DAILY</button>
      </div>
    </div>
    <div id="budget-stats-content" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </div>

</main>

<script type="module">
// ─── FIREBASE ─────────────────────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const FB_CONFIG = {
  apiKey: "AIzaSyD07C7OHAd4b4JSP9yPwx40pkCpd53yKrA",
  authDomain: "infinity-369.firebaseapp.com",
  projectId: "infinity-369",
  storageBucket: "infinity-369.firebasestorage.app",
  messagingSenderId: "1029653211647",
  appId: "1:1029653211647:web:4612a3e5f11b2739c01fca",
  databaseURL: "https://infinity-369-default-rtdb.firebaseio.com"
};
const app = initializeApp(FB_CONFIG);
const db  = getDatabase(app);
const OPERATIVE_ID = "raja_prime";

// ─── STATE ────────────────────────────────────
let S = { budget: [], lastUpdated: 0 };
let isCloudSynced = false;
let undoStack = [];

const MONTH_NAMES = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const CAT_MAP = {
  'v':'Vegetable','vegetable':'Vegetable',
  'f':'Fruit','fr':'Fruit','fruit':'Fruit',
  'm':'Milk','milk':'Milk',
  'g':'Gas','gas':'Gas',
  'p':'Petrol','petrol':'Petrol',
  'ff':'Fast food','fast food':'Fast food',
  'r':'Food ration','food ration':'Food ration',
  'gt':'Given to','given to':'Given to',
  'tf':'Taken from','taken from':'Taken from'
};

// ─── SYNC ─────────────────────────────────────
function setSyncDot(state) {
  const d = document.getElementById('sync-dot');
  if (!d) return;
  d.className = 'w-2 h-2 rounded-full shrink-0 transition-colors duration-300 shadow-sm ' + 
                (state === 'synced' ? 'bg-green-400' : state === 'syncing' ? 'bg-neu-accent animate-pulse' : 'bg-red-500');
  d.title = state === 'synced' ? 'Synced' : state === 'syncing' ? 'Syncing…' : 'Sync error';
}

function save() {
  if (!isCloudSynced) return;
  setSyncDot('syncing');
  // Pull full cloud state, update only budget, push back
  get(ref(db, 'operatives/' + OPERATIVE_ID)).then(snap => {
    const full = snap.exists() ? snap.val() : {};
    full.budget = S.budget;
    full.lastUpdated = Date.now();
    return set(ref(db, 'operatives/' + OPERATIVE_ID), full);
  }).then(() => setSyncDot('synced'))
    .catch(err => { console.error(err); setSyncDot('error'); toast('SYNC ERROR', 'red'); });
}

function syncFromFirebase() {
  setSyncDot('syncing');
  toast('SYNCING...', 'amber');
  get(ref(db, 'operatives/' + OPERATIVE_ID)).then(snap => {
    isCloudSynced = true;
    if (snap.exists()) {
      const data = snap.val();
      S.budget = data.budget || [];
      S.lastUpdated = data.lastUpdated || 0;
    }
    setSyncDot('synced');
    renderBudget();
    toast('SYNC COMPLETE', 'green');
  }).catch(err => {
    isCloudSynced = true;
    console.error(err);
    setSyncDot('error');
    toast('RUNNING OFFLINE', 'red');
  });
}

// ─── HELPERS ──────────────────────────────────
function $(id) { return document.getElementById(id); }
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function toast(msg, type = 'blue') {
  const c = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  if (type === 'red') el.style.color = '#ef4444';
  if (type === 'green') el.style.color = '#22c55e';
  if (type === 'amber') el.style.color = '#f59e0b';
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(10px)'; setTimeout(()=>el.remove(),200); }, 3000);
}

function pushHistory() {
  undoStack.push(JSON.stringify(S.budget));
  if (undoStack.length > 50) undoStack.shift();
}

// ─── BUDGET LOGIC ─────────────────────────────
let activeCategoryTag = null;

window.checkBudgetPerson = function() {
  const val = $('budget-item').value.toLowerCase().trim();
  const pContainer = $('budget-person-container');
  let show = false;
  if (activeCategoryTag === 'gt' || activeCategoryTag === 'tf') show = true;
  if (val.includes('given to') || val.includes('taken from')) show = true;
  pContainer.style.display = show ? 'flex' : 'none';
};

window.addBudgetEntry = function() {
  const inputStr = $('budget-item').value.trim();
  if (!inputStr) { toast('ERR: Input required', 'red'); return; }

  const parts = inputStr.split(/\s+/);
  let amount = 0, mode = 'Online', category = 'Miscellaneous', person = '', item = '';
  const remainingParts = [];

  parts.forEach(p => {
    const num = parseFloat(p);
    if (!isNaN(num) && num > 0 && amount === 0) amount = num;
    else if (p.toLowerCase() === 'cash') mode = 'Cash';
    else if (p.toLowerCase() === 'online') mode = 'Online';
    else remainingParts.push(p);
  });

  if (activeCategoryTag && CAT_MAP[activeCategoryTag.toLowerCase()]) {
    category = CAT_MAP[activeCategoryTag.toLowerCase()];
    if (category === 'Given to' || category === 'Taken from') {
      person = ($('budget-person').value.trim()) || remainingParts.join(' ') || 'Unknown';
    } else {
      item = remainingParts.join(' ');
    }
  } else {
    let catIndex = -1;
    for (let ci = 0; ci < remainingParts.length; ci++) {
      if (CAT_MAP[remainingParts[ci].toLowerCase()]) { catIndex = ci; break; }
    }
    if (catIndex !== -1) {
      category = CAT_MAP[remainingParts[catIndex].toLowerCase()];
      const others = remainingParts.filter((_, i) => i !== catIndex);
      if (category === 'Given to' || category === 'Taken from') {
        person = ($('budget-person').value.trim()) || others.join(' ') || 'Unknown';
      } else {
        item = others.join(' ');
      }
    } else if (remainingParts.length > 0) {
      category = remainingParts.join(' ');
    }
  }

  if (amount <= 0) { toast('ERR: Enter a valid amount', 'red'); return; }

  pushHistory();
  if (!S.budget) S.budget = [];
  S.budget.push({ id: 'b_' + Date.now(), date: Date.now(), category, amount, mode, person, item });

  save();
  renderBudget();

  $('budget-item').value = '';
  $('budget-person').value = '';
  $('budget-person-container').style.display = 'none';

  activeCategoryTag = null;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));

  toast(`RECORDED: ${category}${person?' ('+person+')':''} ₹${amount} · ${mode}`, 'green');
};

window.deleteBudget = function(id) {
  pushHistory();
  S.budget = S.budget.filter(b => b.id !== id);
  save();
  renderBudget();
  toast('DELETED', 'red');
};

window.budgetSelectCat = function(cat, btn) {
  if (activeCategoryTag === cat) {
    activeCategoryTag = null;
    btn.classList.remove('active');
  } else {
    activeCategoryTag = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  checkBudgetPerson();
  $('budget-item').focus();
};

window.clearBalance = function() {
  let onlineTotal = 0, cashTotal = 0;
  (S.budget || []).forEach(b => {
    const sign = b.category.toLowerCase() === 'taken from' ? 1 : -1;
    if (b.mode === 'Online') onlineTotal += sign * b.amount;
    else cashTotal += sign * b.amount;
  });

  if (onlineTotal === 0 && cashTotal === 0) {
    toast('BALANCE IS ALREADY ZERO', 'amber');
    return;
  }

  const total = onlineTotal + cashTotal;
  if (!confirm(`Clear your total balance (₹${total})? This will add adjusting entries to zero out your balance while keeping past history intact.`)) return;

  pushHistory();
  const now = Date.now();
  
  if (onlineTotal !== 0) {
    S.budget.push({
      id: 'b_' + now + '_1',
      date: now,
      category: onlineTotal > 0 ? 'Given to' : 'Taken from',
      amount: Math.abs(onlineTotal),
      mode: 'Online',
      person: 'Balance Reset',
      item: ''
    });
  }
  
  if (cashTotal !== 0) {
    S.budget.push({
      id: 'b_' + now + '_2',
      date: now + 1, // slight offset to prevent ID collision just in case
      category: cashTotal > 0 ? 'Given to' : 'Taken from',
      amount: Math.abs(cashTotal),
      mode: 'Cash',
      person: 'Balance Reset',
      item: ''
    });
  }

  save();
  renderBudget();
  toast('BALANCE CLEARED', 'green');
};

// ─── RENDER ───────────────────────────────────
window.renderBudget = function() {
  const list = $('budget-list');
  if (!list) return;
  list.innerHTML = '';

  let total = 0, onlineTotal = 0, cashTotal = 0, monthTotal = 0;
  const now = new Date();
  const curMonth = now.getMonth(), curYear = now.getFullYear();

  (S.budget || []).forEach(b => {
      const sign = b.category.toLowerCase() === 'taken from' ? 1 : -1;
      total += sign * b.amount;
      if (b.mode === 'Online') onlineTotal += sign * b.amount;
      else cashTotal += sign * b.amount;
      const bd = new Date(b.date);
      if (bd.getMonth() === curMonth && bd.getFullYear() === curYear && sign === -1 && b.person !== 'Balance Reset') monthTotal += b.amount;
    });

  // Update summary
  function setMoney(id, val, redNeg = true) {
    const el = $(id);
    if (!el) return;
    el.textContent = (val < 0 ? '-₹' : '₹') + Math.abs(val).toLocaleString('en-IN');
    if (redNeg) el.className = val >= 0 ? 'text-green-500' : 'text-red-500';
  }
  setMoney('budget-total', total);
  setMoney('budget-online', onlineTotal);
  setMoney('budget-cash', cashTotal);
  if ($('budget-month')) { $('budget-month').textContent = '₹' + monthTotal.toLocaleString('en-IN'); }

  if ($('ledger-month-label')) $('ledger-month-label').textContent = '• ' + MONTH_NAMES[curMonth] + ' ' + curYear;

  const entries = [...(S.budget || [])]
    .filter(b => { const d = new Date(b.date); return d.getMonth() === curMonth && d.getFullYear() === curYear; })
    .reverse();

  if (!entries.length) {
    list.innerHTML = '<div class="font-mono text-neu-accent text-xs p-2">› no transactions this month.</div>';
    return;
  }

  let lastDay = '';
  let htmlStr = '';

  entries.forEach(b => {
    const d = new Date(b.date);
    const dayStr = d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
    const isIncome = b.category.toLowerCase() === 'taken from';
    const colorText = isIncome ? 'text-green-500' : 'text-red-500';
    const amtStr = (isIncome ? '+' : '-') + '₹' + b.amount.toLocaleString('en-IN');
    const displayTitle = b.item || b.person || b.category;
    const timeStr = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');

    if (dayStr !== lastDay) {
      if (lastDay !== '') htmlStr += `</ul></div>`;
      htmlStr += `
        <div class="bg-neu-box p-5 rounded-[20px]">
          <h4 class="text-[11px] font-medium text-neu-text pb-2 mb-3 border-b border-neu-track uppercase tracking-widest font-mono flex items-center gap-2">
            <i class="fa-regular fa-calendar text-neu-highlight"></i> ${dayStr}
          </h4>
          <ul class="space-y-2 min-h-[10px]">
      `;
      lastDay = dayStr;
    }

    htmlStr += `
      <li class="flex items-center justify-between text-xs text-neu-text bg-neu-bg rounded-xl p-3 shadow-sm border border-neu-track/30">
        <div class="flex flex-col gap-1.5 flex-1 min-w-0 pr-2">
          <span class="font-bold text-[13px] text-neu-text truncate">${displayTitle}</span>
          <div class="flex gap-2 items-center flex-wrap">
            <span class="font-mono text-[10px] text-neu-accent uppercase">${b.category}</span>
            <span class="text-neu-track">•</span>
            <span class="font-mono text-[10px] ${b.mode==='Cash'?'text-amber-500':'text-blue-500'}">${b.mode.toUpperCase()}</span>
            <span class="text-neu-track">•</span>
            <span class="font-mono text-[10px] text-neu-accent">${timeStr}</span>
          </div>
        </div>
        <div class="flex items-center gap-3 shrink-0">
          <span class="font-mono font-bold text-sm ${colorText}">${amtStr}</span>
          <button class="text-neu-accent hover:text-red-500 transition-colors p-1" onclick="deleteBudget('${b.id}')" title="Delete">
            <i class="fa-solid fa-xmark text-[13px]"></i>
          </button>
        </div>
      </li>
    `;
  });

  if (lastDay !== '') htmlStr += `</ul></div>`;
  list.innerHTML = htmlStr;
};

// ─── STATS ────────────────────────────────────
window.switchTab = function(tab) {
  $('panel-ledger').classList.toggle('panel-hidden', tab !== 'ledger');
  $('panel-stats').classList.toggle('panel-hidden', tab !== 'stats');
  $('tab-ledger').classList.toggle('active', tab === 'ledger');
  $('tab-stats').classList.toggle('active', tab === 'stats');
  if (tab === 'stats') renderStats('monthly');
};

let statMode = 'monthly';
window.switchStatMode = function(mode) {
  statMode = mode;
  $('bstat-monthly').classList.toggle('active', mode === 'monthly');
  $('bstat-daily').classList.toggle('active', mode === 'daily');
  renderStats(mode);
};

function renderStats(mode) {
  const container = $('budget-stats-content');
  if (!container) return;
  container.innerHTML = '';
  const entries = S.budget || [];
  const now = new Date();
  
  const barColorClass = mode === 'monthly' ? 'bg-amber-500' : 'bg-teal-500';
  const textColorClass = mode === 'monthly' ? 'text-amber-500' : 'text-teal-500';

  const groups = [];

  if (mode === 'monthly') {
      for (let mi = 5; mi >= 0; mi--) {
        const d = new Date(now.getFullYear(), now.getMonth() - mi, 1);
        groups.push({
          label: MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear(),
          items: entries.filter(b => {
            const bd = new Date(b.date);
            return bd.getFullYear() === d.getFullYear() && bd.getMonth() === d.getMonth() && b.category.toLowerCase() !== 'taken from' && b.person !== 'Balance Reset';
          })
        });
      }
    } else {
      for (let di = 29; di >= 0; di--) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - di);
        groups.push({
          label: d.getDate() + ' ' + MONTH_NAMES[d.getMonth()],
          items: entries.filter(b => {
            const bd = new Date(b.date);
            return bd.getDate() === d.getDate() && bd.getMonth() === d.getMonth() && bd.getFullYear() === d.getFullYear() && b.category.toLowerCase() !== 'taken from' && b.person !== 'Balance Reset';
          })
        });
      }
    }

  let hasData = false;
  let html = '';
  groups.forEach(g => {
    if (!g.items.length) return;
    hasData = true;
    const catTotals = {};
    let grandTotal = 0;
    g.items.forEach(b => { catTotals[b.category] = (catTotals[b.category] || 0) + b.amount; grandTotal += b.amount; });

    html += `
      <div class="bg-neu-box p-5 rounded-[20px] flex flex-col">
        <h4 class="text-[11px] font-medium ${textColorClass} pb-2 mb-4 border-b border-neu-track uppercase tracking-widest font-mono flex items-center gap-2">
          <i class="fa-solid fa-chart-pie"></i> ${g.label}
        </h4>
        <div class="flex flex-col gap-4 flex-1">
    `;

    Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).forEach(([cat, amt]) => {
      const pct = Math.round((amt / grandTotal) * 100);
      html += `
        <div class="flex flex-col gap-1.5">
          <div class="flex justify-between items-end">
            <span class="font-mono text-[10px] text-neu-accent uppercase font-semibold">${cat}</span>
            <span class="font-mono text-[11px] text-neu-text font-bold">₹${amt.toLocaleString('en-IN')} <span class="text-neu-accent font-normal">(${pct}%)</span></span>
          </div>
          <div class="w-full bg-neu-track h-1.5 rounded-full overflow-hidden">
            <div class="h-full rounded-full ${barColorClass} transition-all duration-500 ease-out" style="width: ${pct}%"></div>
          </div>
        </div>
      `;
    });

    html += `
        </div>
        <div class="mt-5 pt-3 border-t border-neu-track flex justify-between items-center">
          <span class="font-mono text-[10px] text-neu-accent uppercase tracking-wider font-semibold">Total Spent</span>
          <span class="font-mono text-sm font-bold text-red-500">-₹${grandTotal.toLocaleString('en-IN')}</span>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
  if (!hasData) container.innerHTML = '<div class="font-mono text-neu-accent text-xs p-2">› no data for this period.</div>';
}

// ─── CAT BUTTONS ──────────────────────────────
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', function() { budgetSelectCat(this.dataset.cat, this); });
});

// ─── UNDO ─────────────────────────────────────
document.getElementById('btn-undo').addEventListener('click', () => {
  if (!undoStack.length) { toast('NOTHING TO UNDO', 'amber'); return; }
  S.budget = JSON.parse(undoStack.pop());
  save();
  renderBudget();
  toast('UNDONE', 'amber');
});

// ─── INIT ─────────────────────────────────────
renderBudget();
syncFromFirebase();
</script>
